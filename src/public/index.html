<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>PipeScope</title>
</head>
<body>
    <header>
        <h2>PipeScope</h2>
        <button id="themeToggle" type="button"></button>
    </header>
    <div>
        <p id="platform"></p>
        <p id="cwd"></p>
    </div>
    <form id="pipelineForm">
        <input id="pipelineInput" size="50" placeholder="grep -F ERROR app.log | cut -d ' ' -f 2 | sort | uniq -c">
        <button id="run" disabled>Run</button>
    </form>
    <div id="stages"></div>
    <script src="script.js"></script>
</body>
</html>
